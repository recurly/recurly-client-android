// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

nexusPublishing {
    repositories {
        sonatype {
            // The legacy OSSRH endpoint (oss.sonatype.org) was sunset 2025-06-30
            // and now responds with HTTP 402. Point at Sonatype's OSSRH Staging API
            // bridge into Central Portal so this OSSRH-style plugin keeps working.
            // See: https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
            nexusUrl = uri('https://ossrh-staging-api.central.sonatype.com/service/local/')
            snapshotRepositoryUrl = uri('https://central.sonatype.com/repository/maven-snapshots/')
            // Credentials must be a Central Portal user token (not legacy OSSRH),
            // generated from https://central.sonatype.com/account.
            username = providers.gradleProperty('mavenCentralUsername')
            password = providers.gradleProperty('mavenCentralPassword')
        }
    }
}

// Alias the org-standard task name so the shared release workflow stays portable
// across Recurly Android repos.
tasks.register('closeAndReleaseRepository') {
    dependsOn 'closeAndReleaseSonatypeStagingRepository'
}

