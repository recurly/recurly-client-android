name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # TODO(SWI-5336): actions/create-release is archived and has no node24 release.
      # Remove this flag when a node24-compatible replacement is adopted.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up JDK 11
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '11'
        distribution: 'adopt'

    - uses: gradle/actions/setup-gradle@v6.1.0
    - run: ./gradlew build

    - name: Test
      run: ./gradlew test

    - name: Publish & Upload release
      run: |
           ./gradlew publish --no-daemon --no-parallel
           ./gradlew closeAndReleaseRepository
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    - name: Create Release on GitHub
      id: create_release
      uses: actions/create-release@v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        release_name: ${{ github.event.inputs.version }}
        draft: false
        prerelease: false