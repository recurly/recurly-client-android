name: Release & Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0

    - name: Set up JDK 17
      uses: actions/setup-java@v5.6.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v6.2.0
    - run: ./gradlew build

    - name: Test
      run: ./gradlew test

    - name: Read release version
      id: version
      run: echo "version=$(./gradlew -q :AndroidSdk:properties | grep '^VERSION_NAME:' | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: Publish & Upload release
      run: ./gradlew publishToSonatype closeAndReleaseRepository --no-daemon --no-parallel
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_TOKEN_USER }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_TOKEN }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_LIB_PRIV_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_LIB_PASSPHRASE }}

    - name: Create Release on GitHub
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        generate_release_notes: true
        draft: false
        prerelease: false