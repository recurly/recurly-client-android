name: CI-test
on:
  pull_request:
    types: [opened, synchronize]
  release:
    types: [prereleased]
  push:
    branches:
      - 'master'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: ./gradlew build
      - run: ./gradlew test
