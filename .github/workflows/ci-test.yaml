name: CI-test
on:
  pull_request:
    types: [opened, synchronize]
  release:
    types: [prereleased]
  push:
    branches:
      - 'master'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up JDK 11
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '11'
          distribution: 'adopt'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - run: ./gradlew build
      - run: ./gradlew test
